[build]
# Repo root is the build base. Explicitly set here to override an invalid
# base directory configured in the Netlify UI build settings.
base = ""
command = "npm ci && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22.22.3"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/sw.js"
[headers.values]
Content-Type = "application/javascript"
Cache-Control = "public, max-age=0, must-revalidate"
